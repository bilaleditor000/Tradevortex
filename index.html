    <!-- Filter out benign third-party cross-origin script errors -->

      window.addEventListener('error', function(e) {

          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message === 'Script error.' || (typeof e.reason === 'string' && e.reason.includes('Script error')))) {
          e.stopImmediatePropagation();
        }
      });
    </script>
